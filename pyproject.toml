[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oev"
version = "0.1.0"
description = "Fast typed decisions from next-token logits of local language models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
hf = ["torch>=2.6", "transformers>=5.0,<6", "accelerate>=1.0"]
serve = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jsonschema>=4.23,<5"]
# llama.cpp includes native Flash Attention; this backend needs no flash-attn wheel.
gguf = ["llama-cpp-python>=0.3.36,<0.4"]
mlx = ["mlx-lm>=0.32.0,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'"]
embeddings = ["sentence-transformers[image]>=6.1,<7", "torch>=2.6", "transformers>=5.18,<6", "soundfile>=0.13,<0.14", "scipy>=1.11,<2"]
embedding-media = ["Pillow>=10.3,<13", "soundfile>=0.13,<0.14", "scipy>=1.11,<2"]
mlx-embeddings = [
    "mlx-embeddings>=0.1.0,<0.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-vlm>=0.7.8,<0.8; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "transformers[vision]>=5.19,<6; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "soundfile>=0.13,<0.14; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "scipy>=1.11,<2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
test = ["pytest>=8.0", "httpx>=0.27"]
qat = [
    "compressed-tensors>=0.15,<0.17",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
oev = "oev.cli:main"
oev-serve = "oev.serve:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
