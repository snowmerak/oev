[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oev"
version = "0.1.0"
description = "Fast typed decisions from next-token logits of local language models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
hf = ["torch>=2.6", "transformers>=5.0,<6", "accelerate>=1.0"]
serve = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
oev = "oev.cli:main"
oev-serve = "oev.serve:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
